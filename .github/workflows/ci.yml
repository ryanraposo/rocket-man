name: Rocketman checks
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n install.sh scripts/install-skill.sh scripts/package-release.sh tests/run.sh
      - name: Run installer, release, and mascot tests
        run: bash tests/run.sh
